# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: copiloto-financiero-rag
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: GROQ_API_KEY
        sync: false 
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma_db
      - key: CHROMA_COLLECTION_NAME
        value: financial_docs
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: CHUNK_SIZE
        value: 1000
      - key: CHUNK_OVERLAP
        value: 200
      - key: MAX_RETRIEVED_DOCS
        value: 5
